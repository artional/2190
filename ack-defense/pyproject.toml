[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ack-defense"
version = "0.1.0"
description = "Probe-response reference subspaces for inference-time backdoor detection"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "torch>=2.2",
  "transformers==4.43.4",
  "peft==0.12.0",
  "accelerate==0.32.0",
  "sentencepiece>=0.1.99",
  "protobuf>=3.20"
]

[project.scripts]
ack-defense = "ack_defense.__main__:main"

[tool.setuptools.packages.find]
include = ["ack_defense*"]
